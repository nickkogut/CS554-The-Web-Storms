services:
  frontend:
    build: .
    ports:
      - "5173:5173"
    env_file: .env
    depends_on:
      - mongo
      - redis

  backend:
    build: .
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      - mongo
      - redis
    command: node server.js

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis
    ports:
      - "6379:6379"

volumes:
  mongo-data: