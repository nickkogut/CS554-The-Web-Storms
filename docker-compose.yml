services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    env_file: .env
    depends_on:
      - mongo
      - redis

  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "4000:4000"
      - "4001:4001"
    env_file: .env
    depends_on:
      mongo:
        condition: service_started        
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
  quiz-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: node src/workers/quizResultWorker.js        
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis
    ports:
      - "6379:6379"
    
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:

